<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 13px/1.4 system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: auto; max-height: calc(100vh - 28px); object-fit: contain; background: #000; }

<body>
<canvas id="c"></canvas>
<div id="status">準備中…</div>
<script id="trace" type="x-shader/x-fragment">#version 300 es
precision highp float;
precision highp int;

uniform vec2 uRes;
uniform float uSample;
uniform sampler2D uAccum;
uniform vec3 uCamPos;
uniform vec3 uCamTarget;
uniform float uFov;
uniform float uFocus;
uniform float uAperture;
uniform int uZero; // いつも 0。ループを展開させない（シェーダーの準備が長くかからないように）
#define ZERO uZero
out vec4 fragColor;

// ============================================================
// 乱数・ノイズ
// ============================================================
uint seed;
uint pcg(uint v) { uint s = v * 747796405u + 2891336453u; uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u; return (w >> 22u) ^ w; }
float rnd() { seed = pcg(seed); return float(seed) / 4294967296.0; }

float hash11(float p) { p = fract(p * .1031); p *= p + 33.33; p *= p + p; return fract(p); }
float hash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p3) { p3 = fract(p3 * .1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
vec3 hash33(vec3 p3) { p3 = fract(p3 * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yxx) * p3.zyx); }
vec2 hash22(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }

float noise1(float x) { float i = floor(x); float f = fract(x); f = f * f * (3.0 - 2.0 * f); return mix(hash11(i), hash11(i + 1.0), f); }
float noise2(vec2 x) {
  vec2 i = floor(x); vec2 f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), f.x), mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), f.x), f.y);
}
float noise3(vec3 x) {
  vec3 i = floor(x); vec3 f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash13(i), hash13(i + vec3(1, 0, 0)), f.x), mix(hash13(i + vec3(0, 1, 0)), hash13(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash13(i + vec3(0, 0, 1)), hash13(i + vec3(1, 0, 1)), f.x), mix(hash13(i + vec3(0, 1, 1)), hash13(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}
float fbm1(float x) { float s = 0.0, a = 0.5; for (int i = ZERO; i < 5; i++) { s += a * noise1(x); x = x * 2.07 + 13.1; a *= 0.5; } return s; }
float fbm2(vec2 p) { float s = 0.0, a = 0.5; for (int i = ZERO; i < 5; i++) { s += a * noise2(p); p = p * 2.03 + vec2(7.1, 3.3); a *= 0.5; } return s; }
float fbm3(vec3 p) { float s = 0.0, a = 0.5; for (int i = ZERO; i < 4; i++) { s += a * noise3(p); p = p * 2.03 + vec3(1.7, 9.2, 3.1); a *= 0.5; } return s; }

// 3D のボロノイ：いちばん近い点と2番目の距離、いちばん近いセルの乱数
vec3 voronoi(vec3 x) {
  vec3 i = floor(x); vec3 f = fract(x);
  float f1 = 8.0, f2 = 8.0, id = 0.0;
  for (int k = ZERO - 1; k <= 1; k++)
  for (int j = ZERO - 1; j <= 1; j++)
  for (int l = ZERO - 1; l <= 1; l++) {
    vec3 g = vec3(float(l), float(j), float(k));
    vec3 r = g + hash33(i + g) * 0.9 + 0.05 - f;
    float d = dot(r, r);
    if (d < f1) { f2 = f1; f1 = d; id = hash13(i + g + 17.17); }
    else if (d < f2) { f2 = d; }
  }
  return vec3(sqrt(f1), sqrt(f2), id);
}
vec3 voronoi2(vec2 x) {
  vec2 i = floor(x); vec2 f = fract(x);
  float f1 = 8.0, f2 = 8.0, id = 0.0;
  for (int j = ZERO - 1; j <= 1; j++)
  for (int l = ZERO - 1; l <= 1; l++) {
    vec2 g = vec2(float(l), float(j));
    vec2 r = g + hash22(i + g) - f;
    float d = dot(r, r);
    if (d < f1) { f2 = f1; f1 = d; id = hash12(i + g + 5.3); }
    else if (d < f2) { f2 = d; }
  }
  return vec3(sqrt(f1), sqrt(f2), id);
}

// ============================================================
// 形の部品
// ============================================================
float smin(float a, float b, float k) { float h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h * h * k * 0.25; }
float smax(float a, float b, float k) { return -smin(-a, -b, k); }
float sdSphere(vec3 p, vec3 c, float r) { return length(p - c) - r; }
float sdEllipsoid(vec3 p, vec3 c, vec3 r) { p -= c; float k0 = length(p / r); float k1 = length(p / (r * r)); return k0 * (k0 - 1.0) / k1; }
float sdRoundCone(vec3 p, vec3 a, vec3 b, float r1, float r2) {
  vec3 ba = b - a; float l2 = dot(ba, ba); float rr = r1 - r2; float a2 = l2 - rr * rr; float il2 = 1.0 / l2;
  vec3 pa = p - a; float y = dot(pa, ba); float z = y - l2;
  vec3 xv = pa * l2 - ba * y; float x2 = dot(xv, xv); float y2 = y * y * l2; float z2 = z * z * l2;
  float k = sign(rr) * rr * rr * x2;
  if (sign(z) * a2 * z2 > k) return sqrt(x2 + z2) * il2 - r2;
  if (sign(y) * a2 * y2 < k) return sqrt(x2 + y2) * il2 - r1;
  return (sqrt(x2 * a2 * il2) + y * rr) * il2 - r1;
}
// a→b を長い軸にした楕円体（横の太さ rs、z の太さ rz）
float sdEllAxis(vec3 p, vec3 a, vec3 b, float rs, float rz) {
  vec3 c = 0.5 * (a + b); vec3 u = b - a; float h = 0.5 * length(u); u /= 2.0 * h;
  vec3 v = normalize(vec3(-u.y, u.x, 0.0)); vec3 w = cross(u, v);
  vec3 q = p - c;
  return sdEllipsoid(vec3(dot(q, u), dot(q, v), dot(q, w)), vec3(0.0), vec3(h, rs, rz));
}

// ============================================================
// ティラノサウルス（単位はメートル。x が頭の向き、y が上、z が右＝カメラ側）
// ============================================================
const vec3 SUN = vec3(0.8144, 0.4581, 0.3563); // normalize(0.8, 0.45, 0.35)：夕方近くの、前の右からの低い光
const float YAW = 0.32;       // 首から先をカメラのほうへ向ける
const float JAW = 0.14;       // 口の開き
const float PITCH = 0.12;     // 頭を少し下げる
const vec2 HINGE = vec2(3.55, 3.6);
const vec3 EYE_C = vec3(3.985, 4.025, 0.272);
const float EYE_R = 0.058;

// 足（H 腰, K ひざ, A 足首, B 指の付け根）。手前の右足は前、奥の左足は後ろでかかとを上げる
const vec3 RH = vec3(0.15, 2.9, 0.55), RK = vec3(0.88, 1.83, 0.62), RA = vec3(0.78, 0.63, 0.6), RB = vec3(1.15, 0.11, 0.58);
const vec3 LH = vec3(0.15, 2.9, -0.55), LK = vec3(0.16, 1.62, -0.64), LA = vec3(-0.62, 0.69, -0.6), LB = vec3(-0.35, 0.11, -0.56);

vec3 bend(vec3 p) {
  float a = YAW * smoothstep(2.2, 3.9, p.x);
  float c = cos(a), s = sin(a);
  vec2 q = vec2(p.x - 2.2, p.z);
  q = vec2(q.x * c + q.y * s, -q.x * s + q.y * c);
  vec3 r = vec3(q.x + 2.2, p.y, q.y);
  float b = PITCH * smoothstep(2.9, 3.6, r.x);
  vec2 d = r.xy - vec2(3.3, 3.8);
  float cb = cos(b), sb = sin(b);
  r.xy = vec2(3.3, 3.8) + vec2(d.x * cb - d.y * sb, d.x * sb + d.y * cb);
  return r;
}
vec3 jawSpace(vec3 p) {
  vec2 d = p.xy - HINGE; float c = cos(JAW), s = sin(JAW);
  return vec3(HINGE + vec2(d.x * c - d.y * s, d.x * s + d.y * c), p.z);
}

float lipY(float x) { return 3.58 - 0.025 * smoothstep(3.6, 4.3, x) + 0.06 * smoothstep(4.55, 5.15, x); }

// 上の頭の断面：中心の高さ、縦の半径、口の線での横の半径、上のすぼまり
vec4 upperSec(float x) {
  x = clamp(x, 3.4, 5.2);
  float top = x < 3.95 ? mix(4.03, 4.2, smoothstep(3.4, 3.95, x)) : mix(4.2, 3.97, smoothstep(3.95, 5.15, x));
  float bot = lipY(x) - 0.13;
  float w = mix(0.45, 0.21, smoothstep(3.75, 4.55, x)) - 0.05 * smoothstep(4.55, 5.15, x);
  float taper = mix(0.86, 0.62, smoothstep(3.9, 4.6, x));
  return vec4(0.5 * (top + bot), 0.5 * (top - bot), w, taper);
}
float upperW(vec4 s, float y, float lip) { return s.z * mix(1.0, s.w, clamp((y - lip) / (s.x + s.y - lip), 0.0, 1.0)); }
float upperZ(float x, float y) { vec4 s = upperSec(x); float dy = (y - s.x) / s.y; return upperW(s, y, lipY(x)) * sqrt(max(0.0, 1.0 - dy * dy)); }

vec4 lowerSec(float x) {
  x = clamp(x, 3.35, 5.15);
  float top = lipY(x) + 0.1;
  float bot = mix(3.16, 3.43, smoothstep(3.75, 5.1, x)) + 0.12 * smoothstep(3.7, 3.35, x);
  float w = mix(0.41, 0.18, smoothstep(3.75, 4.55, x)) - 0.04 * smoothstep(4.55, 5.1, x);
  return vec4(0.5 * (top + bot), 0.5 * (top - bot), w, 0.6);
}
float lowerW(vec4 s, float y, float lip) { float bot = s.x - s.y; return s.z * mix(s.w, 1.0, clamp((y - bot) / (lip - bot), 0.0, 1.0)); }
float lowerZ(float x, float y) { vec4 s = lowerSec(x); float dy = (y - s.x) / s.y; return lowerW(s, y, lipY(x)) * sqrt(max(0.0, 1.0 - dy * dy)); }

float sdUpperHead(vec3 p) {
  vec3 q = vec3(p.x, p.y, abs(p.z));
  float lip = lipY(q.x);
  vec4 s = upperSec(q.x);
  float W = upperW(s, q.y, lip);
  float d = (length(vec2(q.z / W, (q.y - s.x) / s.y)) - 1.0) * min(W, s.y);
  d = smax(d, q.x - 5.15, 0.14);
  d = smax(d, 3.42 - q.x, 0.2);
  // 目の上のでっぱり、目の前の小さな角、ほおの張り、あごの筋肉
  d = smin(d, sdEllipsoid(q, vec3(3.93, 4.14, 0.25), vec3(0.24, 0.06, 0.09)), 0.1);
  d = smin(d, sdEllipsoid(q, vec3(4.17, 4.14, 0.18), vec3(0.1, 0.04, 0.06)), 0.06);
  d = smin(d, sdEllipsoid(q, vec3(3.72, 3.72, 0.38), vec3(0.32, 0.16, 0.12)), 0.08);
  d = smin(d, sdEllipsoid(q, vec3(3.58, 3.93, 0.27), vec3(0.26, 0.26, 0.22)), 0.12);
  // 目の前の浅いくぼみ、目のあな、鼻のあな
  d = smax(d, -sdEllipsoid(q, vec3(4.42, 3.84, 0.245), vec3(0.28, 0.1, 0.08)), 0.05);
  d = smax(d, -sdSphere(q, EYE_C + vec3(0.0, 0.0, 0.018), 0.072), 0.025);
  d = smax(d, -sdEllipsoid(q, vec3(5.0, 3.86, 0.12), vec3(0.05, 0.024, 0.035)), 0.015);
  return smax(d, lip - q.y, 0.03);
}

float sdLowerJaw(vec3 p) {
  vec3 q = jawSpace(p); q.z = abs(q.z);
  float lip = lipY(q.x);
  vec4 s = lowerSec(q.x);
  float W = lowerW(s, q.y, lip);
  float d = (length(vec2(q.z / W, (q.y - s.x) / s.y)) - 1.0) * min(W, s.y);
  d = smax(d, q.x - 5.08, 0.12);
  d = smax(d, 3.38 - q.x, 0.18);
  d = smax(d, q.y - lip, 0.03);
  return smin(d, sdEllipsoid(q, vec3(3.95, lip - 0.03, 0.0), vec3(0.5, 0.055, 0.15)), 0.03); // 舌
}

float toothLen(float x) { float u = (x - 4.5) / 0.28; return 0.05 + 0.085 * exp(-u * u); }
float sdTeeth(vec3 p) {
  float d = 1e3;
  // 上の歯（頭の座標）
  vec3 q = vec3(p.x, p.y, abs(p.z));
  float fi = floor((q.x - 4.02) / 0.078 + 0.5);
  for (int k = ZERO - 1; k <= 1; k++) {
    float x = 4.02 + clamp(fi + float(k), 0.0, 12.0) * 0.078;
    float L = toothLen(x) * (0.6 + 0.5 * hash11(x * 91.7)); float lip = lipY(x);
    vec3 root = vec3(x, lip + 0.05, upperZ(x, lip) - 0.034);
    vec3 tip = root + vec3(-0.012 - 0.15 * L + 0.03 * (hash11(x * 13.1) - 0.5), -L - 0.05, 0.004 + 0.012 * hash11(x * 7.3));
    d = min(d, sdRoundCone(q, root, tip, 0.016 + 0.12 * L, 0.004));
  }
  // 下の歯（あごの座標）
  q = jawSpace(p); q.z = abs(q.z);
  fi = floor((q.x - 4.08) / 0.08 + 0.5);
  for (int k = ZERO - 1; k <= 1; k++) {
    float x = 4.08 + clamp(fi + float(k), 0.0, 10.0) * 0.08;
    float L = 0.8 * toothLen(x) * (0.6 + 0.5 * hash11(x * 57.3)); float lip = lipY(x);
    vec3 root = vec3(x, lip - 0.05, lowerZ(x, lip) - 0.036);
    vec3 tip = root + vec3(-0.008 - 0.12 * L + 0.03 * (hash11(x * 17.9) - 0.5), L + 0.05, -0.004);
    d = min(d, sdRoundCone(q, root, tip, 0.014 + 0.12 * L, 0.004));
  }
  return d;
}
float sdEye(vec3 p) { return sdSphere(vec3(p.x, p.y, abs(p.z)), EYE_C, EYE_R); }

// しっぽの芯（x, y, z, 太さ）
const vec4 TAIL[7] = vec4[7](
  vec4(-0.2, 3.32, 0.0, 0.66), vec4(-1.5, 3.27, 0.0, 0.54), vec4(-2.8, 3.12, -0.08, 0.42), vec4(-4.1, 2.92, -0.3, 0.3),
  vec4(-5.3, 2.7, -0.65, 0.19), vec4(-6.4, 2.5, -1.05, 0.105), vec4(-7.3, 2.36, -1.45, 0.035));

float sdBody(vec3 p) {
  float d = sdEllipsoid(p, vec3(0.1, 3.22, 0.0), vec3(1.05, 0.62, 0.62));                 // 腰
  d = smin(d, sdEllipsoid(p, vec3(1.2, 2.88, 0.0), vec3(1.45, 0.92, 0.86)), 0.4);          // 胴
  d = smin(d, sdEllipsoid(p, vec3(1.15, 2.36, 0.0), vec3(1.15, 0.52, 0.76)), 0.35);        // おなか
  d = smin(d, sdEllipsoid(p, vec3(2.15, 2.72, 0.0), vec3(0.78, 0.82, 0.66)), 0.35);       // 胸
  d = smin(d, sdEllipsoid(p, vec3(0.5, 2.25, 0.0), vec3(0.5, 0.42, 0.46)), 0.3);          // こしの下
  d = smin(d, sdRoundCone(p, vec3(2.2, 3.0, 0.0), vec3(3.0, 3.42, 0.0), 0.8, 0.63), 0.3); // 首
  d = smin(d, sdRoundCone(p, vec3(3.0, 3.42, 0.0), vec3(3.55, 3.82, 0.0), 0.63, 0.5), 0.2);
  d = smin(d, sdEllipsoid(p, vec3(3.15, 3.15, 0.0), vec3(0.6, 0.42, 0.48)), 0.3);       // のど
  d = smin(d, sdEllipsoid(p, vec3(-0.8, 2.85, 0.0), vec3(1.1, 0.55, 0.58)), 0.35);        // しっぽの付け根の筋肉
  if (p.x < 0.6) {
    float t = 1e3;
    for (int i = ZERO; i < 6; i++) t = smin(t, sdRoundCone(p, TAIL[i].xyz, TAIL[i + 1].xyz, TAIL[i].w, TAIL[i + 1].w), 0.02);
    d = smin(d, t, 0.3);
  }
  return d;
}

// 指3本（つめは別）。side は z の向き（+1 手前）
vec3 toeDir(float ang) { return vec3(cos(ang), 0.0, sin(ang)); }
float sdToes(vec3 p, vec3 B, float side) {
  float d = 1e3;
  for (int i = ZERO; i < 3; i++) {
    float ang = side * (float(i) - 1.0) * 0.36 + side * 0.1;
    float len = i == 1 ? 1.0 : 0.8;
    vec3 dir = toeDir(ang);
    vec3 m = B + dir * 0.34 * len + vec3(0.0, -0.045, 0.0);
    vec3 t = m + dir * 0.24 * len + vec3(0.0, -0.02, 0.0);
    d = smin(d, sdRoundCone(p, B, m, 0.13, 0.095), 0.04);
    d = smin(d, sdRoundCone(p, m, t, 0.095, 0.065), 0.03);
  }
  return d;
}
float sdFootClaws(vec3 p, vec3 B, float side) {
  float d = 1e3;
  for (int i = ZERO; i < 3; i++) {
    float ang = side * (float(i) - 1.0) * 0.36 + side * 0.1;
    float len = i == 1 ? 1.0 : 0.8;
    vec3 dir = toeDir(ang);
    vec3 t = B + dir * 0.58 * len + vec3(0.0, -0.065, 0.0);
    d = min(d, sdRoundCone(p, t - dir * 0.02 + vec3(0.0, 0.01, 0.0), t + dir * 0.13 + vec3(0.0, -0.045, 0.0), 0.05, 0.006));
  }
  return d;
}
float sdLeg(vec3 p, vec3 H, vec3 K, vec3 A, vec3 B, float side) {
  float d = sdRoundCone(p, H, K, 0.62, 0.33);
  d = smin(d, sdEllAxis(p, H + vec3(0.14, 0.2, 0.04 * side), mix(H, K, 0.78) + vec3(0.12, 0.0, 0.03 * side), 0.5, 0.44), 0.2); // 太ももの前の筋肉
  d = smin(d, sdRoundCone(p, K, A, 0.36, 0.19), 0.15);                                                                   // すね
  d = smin(d, sdEllAxis(p, mix(K, A, 0.04) + vec3(-0.13, 0.0, 0.0), mix(K, A, 0.6) + vec3(-0.06, 0.0, 0.0), 0.25, 0.23), 0.12); // ふくらはぎ
  d = smin(d, sdRoundCone(p, A, B, 0.19, 0.14), 0.08);                                                                   // 足の甲
  return smin(d, sdToes(p, B, side), 0.06);
}

// 小さな腕（2本指）
const vec3 SH = vec3(2.38, 2.45, 0.5), EL = vec3(2.47, 2.07, 0.63), WR = vec3(2.78, 2.0, 0.61);
const vec3 F1 = vec3(2.96, 1.9, 0.65), F2 = vec3(2.93, 1.93, 0.56);
float sdArm(vec3 p) {
  vec3 q = vec3(p.x, p.y, abs(p.z));
  float d = sdRoundCone(q, SH, EL, 0.13, 0.095);
  d = smin(d, sdRoundCone(q, EL, WR, 0.09, 0.07), 0.04);
  d = smin(d, sdRoundCone(q, WR, F1, 0.055, 0.035), 0.03);
  return smin(d, sdRoundCone(q, WR, F2, 0.05, 0.032), 0.03);
}
float sdHandClaws(vec3 p) {
  vec3 q = vec3(p.x, p.y, abs(p.z));
  float a = sdRoundCone(q, F1, F1 + vec3(0.05, -0.08, 0.0), 0.03, 0.004);
  return min(a, sdRoundCone(q, F2, F2 + vec3(0.045, -0.075, 0.0), 0.028, 0.004));
}

// 皮ふ（つめ・歯・目をのぞく）
float skinBase(vec3 pw) {
  vec3 p = bend(pw);
  float d = sdBody(p);
  if (p.x > 3.2) {
    d = smin(d, sdUpperHead(p), 0.12);
    d = smin(d, sdLowerJaw(p), 0.08);
    // ほおとあごの付け根の筋肉で、口の奥のすきまをふさぐ
    vec3 a = vec3(p.x, p.y, abs(p.z));
    d = smin(d, sdEllipsoid(a, vec3(3.66, 3.52, 0.31), vec3(0.3, 0.2, 0.13)), 0.1);
    d = smin(d, sdEllipsoid(a, vec3(3.48, 3.6, 0.3), vec3(0.3, 0.3, 0.15)), 0.15);
  }
  if (abs(pw.z) < 1.4 && pw.x < 2.2 && pw.x > -1.5) {
    d = smin(d, sdLeg(pw, RH, RK, RA, RB, 1.0), 0.35);
    d = smin(d, sdLeg(pw, LH, LK, LA, LB, -1.0), 0.35);
  }
  if (pw.x > 2.0 && pw.x < 3.3 && pw.y < 2.8) d = smin(d, sdArm(p), 0.12);
  return d;
}
float hardBase(vec3 pw) {
  vec3 p = bend(pw);
  float d = 1e3;
  if (p.x > 3.8 && p.y > 3.0 && p.y < 4.2) d = min(d, sdTeeth(p));
  if (p.x > 3.7 && p.y > 3.8) d = min(d, sdEye(p));
  if (pw.y < 0.35) d = min(d, min(sdFootClaws(pw, RB, 1.0), sdFootClaws(pw, LB, -1.0)));
  if (pw.x > 2.7 && pw.x < 3.2 && pw.y < 2.1) d = min(d, sdHandClaws(p));
  return d;
}

// ---------- 皮ふのこまかい凹凸（ウロコ、しわ、筋肉のふくらみ） ----------
// cav はウロコのすきま（0 がみぞ）、cell はウロコごとの乱数
float skinDetail(vec3 pw, out float cav, out float cell) {
  vec3 p = bend(pw);
  float face = smoothstep(3.35, 3.65, p.x) * smoothstep(3.0, 3.3, p.y);
  float foot = 1.0 - smoothstep(0.3, 0.75, p.y);
  // 小さな丸いウロコ（すきまは細く）。顔と足先は少し大きめ
  float sc = mix(mix(32.0, 28.0, face), 22.0, foot);
  vec3 v = voronoi(p * sc);
  float edge = v.y - v.x;
  float groove = smoothstep(0.0, 0.12, edge);
  float bump = groove * (1.0 - 0.45 * v.x);
  cav = groove; cell = v.z;
  float amp = mix(mix(0.0032, 0.0036, face), 0.0045, foot);
  float disp = amp * bump;
  // 少し大きなでこぼこ（遠くから見たときの、ざらっとした感じ）
  disp += 0.0025 * (noise3(p * 14.0) - 0.5);
  // 背中とわき腹に、ところどころ大きな丸いウロコ
  vec3 v2 = voronoi(p * 7.0 + 3.1);
  float bigMask = smoothstep(0.78, 0.95, v2.z) * smoothstep(2.6, 3.4, p.y) * (1.0 - face);
  float big = smoothstep(0.42, 0.12, v2.x);
  disp += 0.008 * big * bigMask;
  cav = min(cav, 1.0 - 0.35 * bigMask * smoothstep(0.3, 0.42, v2.x) * smoothstep(0.5, 0.42, v2.x));
  // 顔はでこぼこ（ワニのような）
  disp += face * 0.01 * (fbm3(p * 8.0) - 0.5);
  // 首とおなかのしわ（横すじ）
  float neck = smoothstep(2.2, 2.7, p.x) * (1.0 - smoothstep(3.45, 3.7, p.x));
  float belly = smoothstep(2.6, 2.1, p.y) * (1.0 - foot) * smoothstep(-0.3, 0.3, p.x) * (1.0 - smoothstep(2.6, 3.0, p.x));
  float folds = neck + 0.6 * belly;
  if (folds > 0.0) {
    float w = 1.0 - abs(sin(p.x * 13.0 + 2.5 * fbm3(p * 2.0) + p.y * 2.0));
    disp -= folds * 0.006 * pow(w, 8.0);
  }
  // ひざのしわ
  float knee = max(1.0 - smoothstep(0.0, 0.35, length(pw - RK)), 1.0 - smoothstep(0.0, 0.35, length(pw - LK)));
  if (knee > 0.0) disp -= knee * 0.01 * pow(1.0 - abs(sin(pw.y * 22.0 + 3.0 * noise3(pw * 4.0))), 5.0);
  // 筋肉や脂肪のゆるいふくらみ
  disp += 0.014 * (fbm3(p * 1.6) - 0.5);
  return disp;
}

// ---------- 地面 ----------
float groundH(vec2 xz, bool detail) {
  float h = 0.08 * (fbm2(xz * 0.21) - 0.5);
  // 足のまわりは平らにして、少しへこませる
  float near = min(length(xz - vec2(1.35, 0.58)), length(xz - vec2(-0.15, -0.56)));
  h *= smoothstep(0.4, 1.4, near);
  h -= 0.025 * (1.0 - smoothstep(0.3, 0.7, near));
  if (detail) {
    h += 0.018 * (fbm2(xz * 2.3) - 0.5);
    vec3 v = voronoi2(xz * 5.0);
    h += 0.012 * smoothstep(0.32, 0.05, v.x) * step(0.94, v.z);
    vec3 v2 = voronoi2(xz * 17.0 + 3.0);
    h += 0.005 * smoothstep(0.3, 0.05, v2.x) * step(0.6, v2.z);
  }
  return h;
}

// ============================================================
// シーン
// ============================================================
// mat: 1 皮ふ, 2 目, 3 歯, 4 つめ, 5 地面, 6 しげみ, 7 岩
// 遠くのしげみ（x, z, 大きさ）と、岩（x, z, 大きさ）
const vec3 SHRUBS[8] = vec3[8](vec3(-3.0, -11.0, 1.6), vec3(7.0, -15.0, 2.2), vec3(-11.0, -8.0, 1.8), vec3(15.0, -24.0, 2.8),
  vec3(-7.0, -28.0, 3.0), vec3(2.0, -34.0, 3.5), vec3(-19.0, -17.0, 2.5), vec3(22.0, -12.0, 2.0));
const vec3 ROCKS[4] = vec3[4](vec3(-1.6, 5.4, 0.3), vec3(2.7, 1.9, 0.17), vec3(-6.0, -4.0, 0.6), vec3(10.0, -5.0, 0.7));
float sdProps(vec3 p, out int mat) {
  float d = 1e3; mat = 6;
  if (p.z < -5.0 && p.y < 8.0) {
    for (int i = ZERO; i < 8; i++) {
      vec3 s = SHRUBS[i];
      vec3 q = p - vec3(s.x, 0.0, s.y);
      float bound = length(q - vec3(0.0, 0.4 * s.z, 0.0)) - 1.5 * s.z;
      if (bound > 0.5) { d = min(d, bound); continue; }
      float e = sdEllipsoid(q, vec3(0.0, 0.25 * s.z, 0.0), vec3(1.2 * s.z, 0.55 * s.z, s.z));
      e += (fbm3(p * 1.3 + float(i) * 7.0) - 0.5) * 0.7 * s.z;
      d = min(d, e * 0.55);
    }
  }
  for (int i = ZERO; i < 4; i++) {
    vec3 s = ROCKS[i];
    vec3 q = p - vec3(s.x, 0.0, s.y);
    float bound = length(q) - 1.6 * s.z;
    if (bound > 0.3) { d = min(d, bound); continue; }
    float e = sdEllipsoid(q, vec3(0.0, 0.15 * s.z, 0.0), vec3(1.2 * s.z, 0.75 * s.z, s.z));
    e += (fbm3(p * 5.0 / s.z) - 0.5) * 0.35 * s.z;
    if (e * 0.6 < d) { d = e * 0.6; mat = 7; }
  }
  return d;
}

float mapBase(vec3 p) {
  float d = p.y - groundH(p.xz, false) + 0.02;
  int pm; d = min(d, sdProps(p, pm));
  vec3 bmin = vec3(-7.6, -0.1, -2.0), bmax = vec3(5.6, 4.6, 2.4);
  vec3 b = max(bmin - p, p - bmax);
  float box = length(max(b, 0.0)) + min(max(b.x, max(b.y, b.z)), 0.0);
  if (box > 0.3) return min(d, box);
  return min(d, min(skinBase(p), hardBase(p)));
}

float map(vec3 p, out int mat) {
  float g = (p.y - groundH(p.xz, length(p.xz - vec2(0.5, 0.0)) < 30.0)) * 0.8;
  mat = 5;
  int pm; float pr = sdProps(p, pm);
  if (pr < g) { g = pr; mat = pm; }
  vec3 bmin = vec3(-7.6, -0.1, -2.0), bmax = vec3(5.6, 4.6, 2.4);
  vec3 b = max(bmin - p, p - bmax);
  float box = length(max(b, 0.0)) + min(max(b.x, max(b.y, b.z)), 0.0);
  if (box > 0.3) return min(g, box);
  float s = skinBase(p);
  if (s < 0.05) { float cav, cell; s -= skinDetail(p, cav, cell); s *= 0.85; }
  float h = hardBase(p);
  float d = g;
  if (s < d) { d = s; mat = 1; }
  if (h < d) {
    d = h;
    vec3 q = bend(p);
    mat = sdEye(q) < h + 1e-3 ? 2 : (p.y < 0.4 || q.y < 2.2 ? 4 : 3);
  }
  return d;
}
float mapD(vec3 p) { int m; return map(p, m); }

vec3 calcNormal(vec3 p, float eps) {
  // 4方向の差（ループにして、map を何度も展開しない）
  vec3 n = vec3(0.0);
  for (int i = ZERO; i < 4; i++) {
    vec3 e = 0.5773 * (2.0 * vec3(float(((i + 3) >> 1) & 1), float((i >> 1) & 1), float(i & 1)) - 1.0);
    n += e * mapD(p + e * eps);
  }
  return normalize(n);
}

bool march(vec3 ro, vec3 rd, float tmax, out float t, out int mat) {
  t = 0.05;
  for (int i = ZERO; i < 400; i++) {
    vec3 p = ro + rd * t;
    float d = map(p, mat);
    if (abs(d) < 0.0004 * t + 0.0002) return true;
    t += d * 0.9;
    if (t > tmax) break;
  }
  return false;
}

float shadowRay(vec3 ro, vec3 rd) {
  float t = 0.01;
  for (int i = ZERO; i < 160; i++) {
    float d = mapBase(ro + rd * t);
    if (d < 0.0008) return 0.0;
    t += max(d * 0.95, 0.005);
    if (t > 22.0 || ro.y + rd.y * t > 5.0) break;
  }
  return 1.0;
}
// 空へぬけるか（ぬけなければ、当たったところの距離）
float occRay(vec3 ro, vec3 rd, float tmax) {
  float t = 0.01;
  for (int i = ZERO; i < 90; i++) {
    float d = mapBase(ro + rd * t);
    if (d < 0.002) return t;
    t += max(d, 0.01);
    if (t > tmax) break;
  }
  return -1.0;
}

// ---------- 空と遠くの景色 ----------
vec3 skyCol(vec3 rd) {
  float y = max(rd.y, 0.0);
  vec3 hor = vec3(0.62, 0.66, 0.7);
  vec3 zen = vec3(0.14, 0.29, 0.6);
  vec3 col = mix(hor, zen, pow(y, 0.5));
  float sd = max(dot(rd, SUN), 0.0);
  col += vec3(1.0, 0.82, 0.6) * (0.18 * pow(sd, 6.0) + 0.5 * pow(sd, 60.0));
  // うすい雲
  if (rd.y > 0.0) {
    vec2 uv = rd.xz / (rd.y + 0.08);
    float c = smoothstep(0.5, 0.85, fbm2(uv * 0.55 + vec2(3.0, 1.0)));
    col = mix(col, vec3(0.92, 0.9, 0.86) * (0.85 + 0.25 * pow(sd, 3.0)), c * 0.65 * smoothstep(0.0, 0.25, rd.y));
  }
  return col;
}
vec3 fogCol(vec3 rd) {
  float sd = max(dot(rd, SUN), 0.0);
  return vec3(0.56, 0.6, 0.64) + vec3(0.22, 0.15, 0.07) * pow(sd, 4.0);
}
vec3 farScene(vec3 ro, vec3 rd) {
  vec3 col = skyCol(rd);
  float az = atan(rd.z, rd.x);
  float el = rd.y;
  // 遠い山
  float m = 0.035 + 0.06 * fbm1(az * 2.3 + 1.0) + 0.02 * fbm1(az * 9.0);
  if (el < m) col = mix(col, vec3(0.45, 0.52, 0.6), 0.45);
  // 森（とがった針葉樹）
  float u = az * 140.0;
  float ci = floor(u);
  float spikes = 0.0;
  for (int k = ZERO - 1; k <= 1; k++) {
    float c = ci + float(k);
    float hgt = 0.012 + 0.03 * hash11(c * 1.37) * (0.4 + 0.6 * fbm1(c * 0.05));
    float cx = c + 0.5 + 0.4 * (hash11(c * 3.1) - 0.5);
    spikes = max(spikes, hgt * max(0.0, 1.0 - abs(u - cx) / (1.2 + 0.8 * hash11(c * 7.7))));
  }
  float tr = 0.012 + 0.02 * fbm1(az * 5.0) + spikes;
  if (el < tr) col = mix(fogCol(rd), vec3(0.16, 0.2, 0.17), 0.55 - 0.25 * smoothstep(0.0, 0.06, tr - el) * 0.0);
  // 地面（遠くは平らとして描く）
  if (rd.y < 0.0) {
    float t = -ro.y / rd.y;
    vec3 p = ro + rd * t;
    vec3 g = vec3(0.22, 0.18, 0.13) * (0.75 + 0.5 * fbm2(p.xz * 0.15));
    g = mix(g, vec3(0.18, 0.2, 0.1), smoothstep(0.55, 0.75, fbm2(p.xz * 0.06 + 4.0)));
    vec3 lit = g * (vec3(1.0, 0.84, 0.64) * 3.1 * SUN.y + vec3(0.42, 0.55, 0.78) * 0.55);
    col = mix(lit, fogCol(rd), 1.0 - exp(-t * 0.009));
  }
  return col;
}

// ---------- 色 ----------
vec3 skinAlbedo(vec3 pw, vec3 n, float cav, float cell, out float rough) {
  vec3 p = bend(pw);
  float face = smoothstep(3.35, 3.65, p.x) * smoothstep(3.0, 3.3, p.y);
  float foot = 1.0 - smoothstep(0.4, 1.2, p.y);
  float up = n.y + 0.25 * (fbm3(p * 0.9) - 0.5);
  vec3 dorsal = vec3(0.042, 0.036, 0.027);
  vec3 flank = vec3(0.115, 0.088, 0.06);
  vec3 belly = vec3(0.27, 0.225, 0.16);
  vec3 c = mix(flank, dorsal, smoothstep(0.05, 0.8, up));
  float under = smoothstep(-0.1, -0.6, up) * (1.0 - foot);
  c = mix(c, belly, under);
  // 背中としっぽの暗いしま
  float st = sin(p.x * 6.5 + 4.0 * fbm3(p * vec3(0.6, 1.3, 1.3))) * (0.5 + noise3(p * 0.9));
  float stripe = smoothstep(0.1, 0.75, st) * smoothstep(-0.35, 0.35, up) * (1.0 - 0.7 * face) * (1.0 - foot);
  c *= mix(1.0, 0.62, stripe);
  // まだら
  c *= 0.8 + 0.4 * fbm3(p * 3.3);
  // 顔：鼻先と口のまわりは赤み、目のまわりは暗く、口のふちは明るく
  if (face > 0.0) {
    vec3 fc = mix(vec3(0.12, 0.092, 0.07), vec3(0.06, 0.052, 0.042), smoothstep(-0.1, 0.7, n.y));
    fc *= 0.75 + 0.5 * fbm3(p * 6.0);
    float eye = 1.0 - smoothstep(0.06, 0.2, length(vec3(p.x, p.y, abs(p.z)) - EYE_C));
    fc *= 1.0 - 0.45 * eye;
    float lipUp = 1.0 - smoothstep(0.0, 0.06, abs(p.y - lipY(p.x)));
    vec3 jq = jawSpace(p);
    float lipLo = 1.0 - smoothstep(0.0, 0.05, abs(jq.y - lipY(jq.x)));
    fc = mix(fc, vec3(0.19, 0.16, 0.13), 0.5 * max(lipUp, lipLo) * smoothstep(3.7, 4.0, p.x));
    c = mix(c, fc, face * (1.0 - under * 0.6));
  }
  // 足先は灰色っぽく
  c = mix(c, vec3(0.11, 0.1, 0.085), foot * 0.7);
  // ウロコごとの色のちがいと、みぞの暗さ
  c *= 0.9 + 0.2 * cell;
  c *= mix(mix(0.5, 0.72, face), 1.0, cav);
  rough = mix(0.8, 0.55, cav);
  // 口の中
  vec3 jq = jawSpace(p);
  // 歯の列より内側だけ（外側は口のふちの皮ふ）
  float lipU = lipY(p.x), lipL = lipY(jq.x);
  bool onUpper = abs(p.y - lipU) < abs(jq.y - lipL);
  bool within = onUpper ? abs(p.z) < upperZ(p.x, lipU) - 0.045 : abs(jq.z) < lowerZ(jq.x, lipL) - 0.05;
  bool inside = p.x > 3.45 && p.x < 5.1 && p.y < lipU + 0.01 && jq.y > lipL - 0.01 && within;
  if (inside) {
    float tongue = step(abs(jq.z), 0.15);
    c = mix(vec3(0.07, 0.04, 0.034), vec3(0.11, 0.05, 0.045), tongue) * (0.8 + 0.3 * fbm3(p * 12.0));
    rough = 0.3;
  }
  return c;
}

vec3 lighting(vec3 p, vec3 n, vec3 rd, vec3 alb, float rough, float f0, float sss, float occScale) {
  vec3 sunC = vec3(1.0, 0.84, 0.64) * 3.1;
  // 太陽：少しぼけた影（太陽の大きさの中から方向を選ぶ）
  vec3 jit = normalize(SUN + 0.012 * (vec3(rnd(), rnd(), rnd()) - 0.5));
  float ndl = dot(n, jit);
  float sh = (ndl > -0.3) ? shadowRay(p + n * 0.006, jit) : 0.0;
  float dif = sss > 0.0 ? clamp((ndl + 0.3) / 1.3, 0.0, 1.0) : max(ndl, 0.0);
  float edge = sss * smoothstep(-0.3, 0.0, ndl) * (1.0 - smoothstep(0.0, 0.45, ndl));
  vec3 col = alb * sunC * dif * sh * mix(vec3(1.0), vec3(1.12, 0.9, 0.82), edge);
  // 空の光とまわりからの照り返し（1回だけはね返る）：半球からランダムに1本
  float r1 = rnd(), r2 = rnd();
  vec3 up = abs(n.y) < 0.99 ? vec3(0, 1, 0) : vec3(1, 0, 0);
  vec3 tx = normalize(cross(up, n)); vec3 ty = cross(n, tx);
  float sr = sqrt(r1); float ph = 6.2831853 * r2;
  vec3 dir = normalize(tx * sr * cos(ph) + ty * sr * sin(ph) + n * sqrt(max(0.0, 1.0 - r1)));
  float hit = occRay(p + n * 0.006, dir, 6.0 * occScale);
  if (hit < 0.0) {
    col += alb * skyCol(dir) * 0.45;
  } else {
    // 当たったところの明るさのおおよそ（地面なら日なたの土、恐竜なら暗い皮ふ）
    vec3 hp = p + n * 0.006 + dir * hit;
    float isGround = step(hp.y, 0.08);
    vec3 halb = mix(vec3(0.13, 0.11, 0.08), vec3(0.3, 0.25, 0.19), isGround);
    float hl = isGround > 0.5 ? SUN.y * 0.85 : 0.25;
    col += alb * halb * (sunC * hl + vec3(0.22, 0.28, 0.38));
  }
  // つや（GGX）
  vec3 v = -rd; vec3 h = normalize(jit + v);
  float nh = max(dot(n, h), 0.0), nv = max(dot(n, v), 1e-3), nl = max(ndl, 0.0);
  float a = rough * rough; float a2 = a * a;
  float dd = nh * nh * (a2 - 1.0) + 1.0;
  float D = a2 / (3.14159 * dd * dd);
  float kk = a * 0.5;
  float G = nl / (nl * (1.0 - kk) + kk) * nv / (nv * (1.0 - kk) + kk);
  float F = f0 + (1.0 - f0) * pow(1.0 - max(dot(h, v), 0.0), 5.0);
  col += sunC * sh * D * G * F / (4.0 * nv);
  float Fv = f0 + (1.0 - f0) * pow(1.0 - nv, 5.0);
  vec3 rdir = reflect(rd, n);
  col += skyCol(rdir) * Fv * (1.0 - rough) * (hit < 0.0 ? 1.0 : 0.3) * 0.8;
  return col;
}

vec3 render(vec3 ro, vec3 rd) {
  float t; int mat;
  if (!march(ro, rd, 70.0, t, mat)) return farScene(ro, rd);
  vec3 p = ro + rd * t;
  vec3 n = calcNormal(p, 0.0004 + 0.00025 * t);
  // 材質ごとに色とつやを決めてから、光の計算は1回だけ（シェーダーが大きくならないように）
  vec3 alb; float rough, f0, sss, occScale;
  if (mat == 1) {
    float cav, cell;
    skinDetail(p, cav, cell);
    alb = skinAlbedo(p, n, cav, cell, rough);
    f0 = 0.028; sss = 1.0; occScale = 1.0;
  } else if (mat == 2) {
    // 目：琥珀色の虹彩と丸い瞳、ぬれた表面
    vec3 q = bend(p); q.z = abs(q.z);
    vec3 e = normalize(q - EYE_C);
    vec3 axis = normalize(vec3(0.42, 0.08, 1.0));
    float ang = acos(clamp(dot(e, axis), -1.0, 1.0));
    vec3 iris = vec3(0.3, 0.18, 0.05) * (0.65 + 0.7 * noise3(e * 30.0));
    iris = mix(iris, vec3(0.08, 0.04, 0.015), smoothstep(0.36, 0.52, ang));
    alb = mix(vec3(0.005), iris, smoothstep(0.2, 0.24, ang));
    alb = mix(alb, vec3(0.06, 0.04, 0.03), smoothstep(0.62, 0.7, ang));
    rough = 0.06; f0 = 0.04; sss = 0.0; occScale = 0.5;
  } else if (mat == 3) {
    vec3 q = bend(p);
    float gum = 1.0 - smoothstep(0.0, 0.05, abs(q.y - lipY(q.x)));
    alb = mix(vec3(0.46, 0.4, 0.29), vec3(0.25, 0.18, 0.13), gum) * (0.85 + 0.3 * noise3(q * 40.0));
    rough = 0.32; f0 = 0.045; sss = 0.3; occScale = 0.5;
  } else if (mat == 4) {
    alb = vec3(0.05, 0.045, 0.04);
    rough = 0.3; f0 = 0.04; sss = 0.0; occScale = 0.5;
  } else if (mat == 6) {
    // しげみ：暗い緑に、葉のむら
    alb = mix(vec3(0.035, 0.05, 0.022), vec3(0.08, 0.09, 0.035), noise3(p * 6.0)) * (0.7 + 0.6 * noise3(p * 23.0));
    rough = 0.8; f0 = 0.03; sss = 0.6; occScale = 3.0;
  } else if (mat == 7) {
    alb = vec3(0.2, 0.185, 0.165) * (0.6 + 0.6 * fbm3(p * 9.0));
    rough = 0.85; f0 = 0.03; sss = 0.0; occScale = 1.0;
  } else {
    // 土：乾いた泥、小石、ところどころ草
    vec3 v = voronoi2(p.xz * 5.0);
    alb = vec3(0.22, 0.18, 0.135) * (0.7 + 0.6 * fbm2(p.xz * 0.9));
    alb = mix(alb, vec3(0.17, 0.155, 0.13) * (0.7 + 0.6 * v.z), smoothstep(0.3, 0.06, v.x) * step(0.94, v.z));
    float grass = smoothstep(0.6, 0.76, fbm2(p.xz * 0.35 + 2.0)) * smoothstep(1.5, 3.0, length(p.xz - vec2(0.5, 0.0)));
    alb = mix(alb, vec3(0.12, 0.12, 0.065) * (0.7 + 0.6 * noise2(p.xz * 30.0)), grass);
    alb *= 0.85 + 0.3 * noise2(p.xz * 40.0);
    rough = 0.92; f0 = 0.02; sss = 0.0; occScale = 1.0;
  }
  vec3 col = lighting(p, n, rd, alb, rough, f0, sss, occScale);
  // 空気のかすみ
  return mix(col, fogCol(rd), 1.0 - exp(-t * 0.007));
}

void main() {
  ivec2 ip = ivec2(gl_FragCoord.xy);
  vec4 prev = texelFetch(uAccum, ip, 0);
  seed = uint(ip.x) * 1973u + uint(ip.y) * 9277u + uint(uSample) * 26699u + 1u;
  seed = pcg(seed);
  vec2 uv = (gl_FragCoord.xy + vec2(rnd(), rnd()) - 0.5 * uRes) / uRes.y;
  vec3 ww = normalize(uCamTarget - uCamPos);
  vec3 uu = normalize(cross(ww, vec3(0, 1, 0)));
  vec3 vv = cross(uu, ww);
  float fl = 0.5 / tan(0.5 * uFov);
  vec3 rd = normalize(uv.x * uu + uv.y * vv + fl * ww);
  // 被写界深度（レンズの上の点をランダムに）
  vec3 fp = uCamPos + rd * (uFocus / dot(rd, ww));
  float lr = sqrt(rnd()) * uAperture; float la = 6.2831853 * rnd();
  vec3 ro = uCamPos + uu * lr * cos(la) + vv * lr * sin(la);
  rd = normalize(fp - ro);
  vec3 col = render(ro, rd);
  col = clamp(col, 0.0, 40.0);
  fragColor = prev + vec4(col, 1.0);
}
</script>
<script id="display" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform sampler2D uAccum;
uniform vec2 uRes;
uniform float uExposure;
out vec4 fragColor;
vec3 aces(vec3 x) { const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14; return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0); }
float h12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
void main() {
  vec4 a = texelFetch(uAccum, ivec2(gl_FragCoord.xy), 0);
  vec3 c = a.a > 0.0 ? a.rgb / a.a : vec3(0.0);
  c *= uExposure;
  // 色の調子：影は少し青く、明るいところは少しあたたかく
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  c = mix(c, c * vec3(0.92, 1.0, 1.08), 1.0 - smoothstep(0.0, 0.5, l));
  c = aces(c);
  vec2 uv = gl_FragCoord.xy / uRes;
  c *= 1.0 - 0.28 * pow(length((uv - 0.5) * vec2(1.0, 0.8)) * 1.25, 2.4);
  c = pow(c, vec3(1.0 / 2.2));
  c = mix(c, c * c * (3.0 - 2.0 * c), 0.25);
  c += (h12(gl_FragCoord.xy) - 0.5) * 0.018;
  fragColor = vec4(c, 1.0);
}
</script>
<script type="module">
const params = new URLSearchParams(location.search);
const W = +(params.get("w") ?? 960), H = +(params.get("h") ?? 540);
const SPP = +(params.get("spp") ?? 8);
const NAME = params.get("name") ?? "realistic-trex";
const SAVE = params.get("save") === "1";
const num = (k, d) => (params.get(k) ? params.get(k).split(",").map(Number) : d);
const cam = {
  pos: num("pos", [5.2, 1.7, 9.2]),
  target: num("target", [0.6, 2.25, 0.0]),
  fov: (num("fov", [38])[0] * Math.PI) / 180,
  focus: num("focus", [8.6])[0],
  aperture: num("aperture", [0.05])[0],
  exposure: num("exposure", [0.78])[0],
};

const status = document.getElementById("status");
const canvas = document.getElementById("c");
canvas.width = W;
canvas.height = H;
const gl = canvas.getContext("webgl2", { preserveDrawingBuffer: true, antialias: false });
if (!gl) throw (status.textContent = "WebGL2 が使えません");
if (!gl.getExtension("EXT_color_buffer_float")) throw (status.textContent = "EXT_color_buffer_float が使えません");

const vsSrc = `#version 300 es
void main() { vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
// シェーダーは裏で準備させて、待っているあいだもページが固まらないようにする
const parallel = gl.getExtension("KHR_parallel_shader_compile");
function startProgram(fsId) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vsSrc], [gl.FRAGMENT_SHADER, document.getElementById(fsId).textContent]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  return p;
}
async function ready(p) {
  const t = performance.now();
  if (parallel) {
    while (!gl.getProgramParameter(p, parallel.COMPLETION_STATUS_KHR)) {
      status.textContent = `シェーダーを準備中… ${((performance.now() - t) / 1000).toFixed(0)} 秒`;
      await new Promise((r) => setTimeout(r, 250));
    }
  }
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    const log = gl.getAttachedShaders(p).map((s) => gl.getShaderInfoLog(s)).join("\n") + gl.getProgramInfoLog(p);
    status.textContent = "シェーダーのエラー: " + log;
    console.error(log);
    throw new Error(log);
  }
  console.log(`shader ready in ${((performance.now() - t) / 1000).toFixed(1)} s`);
  return p;
}
const display = await ready(startProgram("display"));
const trace = await ready(startProgram("trace"));
const U = (p, n) => gl.getUniformLocation(p, n);

function target() {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32F, W, H);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  return { tex, fb };
}
const A = target(); // たまった結果
const B = target(); // 1回分を足したもの（タイルごとに A へ写す）

// 画面をタイルに分けて、少しずつ描く（GPU が長く止まらないように）
let tile = 64;
const tiles = () => {
  const list = [];
  for (let y = 0; y < H; y += tile) for (let x = 0; x < W; x += tile) list.push([x, y, Math.min(tile, W - x), Math.min(tile, H - y)]);
  return list;
};
let queue = tiles();
let sample = 0;
const t0 = performance.now();
let lastShow = 0;

function drawTile([x, y, w, h]) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, B.fb);
  gl.viewport(0, 0, W, H);
  gl.enable(gl.SCISSOR_TEST);
  gl.scissor(x, y, w, h);
  gl.useProgram(trace);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, A.tex);
  gl.uniform1i(U(trace, "uAccum"), 0);
  gl.uniform2f(U(trace, "uRes"), W, H);
  gl.uniform1f(U(trace, "uSample"), sample);
  gl.uniform3fv(U(trace, "uCamPos"), cam.pos);
  gl.uniform3fv(U(trace, "uCamTarget"), cam.target);
  gl.uniform1f(U(trace, "uFov"), cam.fov);
  gl.uniform1f(U(trace, "uFocus"), cam.focus);
  gl.uniform1f(U(trace, "uAperture"), cam.aperture);
  gl.uniform1i(U(trace, "uZero"), 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, B.fb);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, A.fb);
  gl.blitFramebuffer(x, y, x + w, y + h, x, y, x + w, y + h, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  gl.disable(gl.SCISSOR_TEST);
}
function show() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(display);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, A.tex);
  gl.uniform1i(U(display, "uAccum"), 0);
  gl.uniform2f(U(display, "uRes"), W, H);
  gl.uniform1f(U(display, "uExposure"), cam.exposure);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
const sec = () => ((performance.now() - t0) / 1000).toFixed(0);
const loop = new MessageChannel();
loop.port1.onmessage = step;
function step() {
  const start = performance.now();
  let slowest = 0;
  while (performance.now() - start < 60 && queue.length) {
    const t = performance.now();
    drawTile(queue.shift());
    gl.finish();
    slowest = Math.max(slowest, performance.now() - t);
  }
  if (!queue.length) {
    sample++;
    // 1枚のタイルに時間がかかりすぎるなら小さく、速すぎるなら大きく（GPU が止まったと思われないように）
    if (slowest > 300 && tile > 32) tile /= 2;
    else if (slowest < 25 && tile < 256) tile *= 2;
    queue = tiles();
  }
  if (performance.now() - lastShow > 1000 || sample >= SPP) {
    show();
    lastShow = performance.now();
    status.textContent = `${W}x${H}  ${sample}/${SPP} 回  ${sec()} 秒`;
  }
  if (sample >= SPP) return finish();
  loop.port2.postMessage(0);
}
function finish() {
  show();
  status.textContent = `できあがり：${W}x${H}  ${SPP} 回  ${sec()} 秒` + (SAVE ? "（保存中…）" : "");
  window.renderDone = true;
  if (!SAVE) return;
  canvas.toBlob(async (blob) => {
    const r = await fetch(`/save?name=${encodeURIComponent(NAME)}`, { method: "POST", body: blob });
    status.textContent = `できあがり：${W}x${H}  ${SPP} 回  ${sec()} 秒  ` + (r.ok ? `out/${NAME}.png に保存しました` : "保存できませんでした");
    window.saved = r.ok;
  }, "image/png");
}
loop.port2.postMessage(0);
</script>
